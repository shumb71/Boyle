name: Fitbit Sync

on:
  schedule:
    # Cada 3 horas, mismo ritmo que garmin_sync
    - cron: '0 */3 * * *'
  workflow_dispatch: {}   # permite lanzarlo a mano desde la pestaña Actions de GitHub

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar fitbit_sync.py
        env:
          FITBIT_CLIENT_ID: ${{ secrets.FITBIT_CLIENT_ID }}
          FITBIT_CLIENT_SECRET: ${{ secrets.FITBIT_CLIENT_SECRET }}
          FITBIT_REFRESH_TOKEN: ${{ secrets.FITBIT_REFRESH_TOKEN }}
        run: python fitbit_sync.py

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fitbit_historial.json
          git diff --staged --quiet || git commit -m "Actualizar fitbit_historial.json [skip ci]"
          git push
